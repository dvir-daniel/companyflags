# CompanyFlags with Postgres.
#   echo "BETTER_AUTH_SECRET=$(openssl rand -base64 32)" > .env
#   docker compose up -d
# then docker compose logs companyflags shows a setup link: open it to make the admin account. Settings: .env.example.
services:
  companyflags:
    image: ghcr.io/dvir-daniel/companyflags:latest
    build: .
    ports:
      - "8787:8787"
    # every setting in .env reaches the server (.env.example lists them); these two are set here
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://companyflags:companyflags@postgres:5432/companyflags
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in .env (openssl rand -base64 32)}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:8787}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: companyflags
      POSTGRES_PASSWORD: companyflags
      POSTGRES_DB: companyflags
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U companyflags -d companyflags"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres:
