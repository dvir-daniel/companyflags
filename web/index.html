<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>CompanyFeatures</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23000'/%3E%3Cpath d='M2 2h12v3H2zM2 6.5h8.5v3H2zM2 11h5v3H2z' fill='%23fafafa'/%3E%3C/svg%3E" />
    <!-- light or dark before the first paint (packages/ui/src/lib/theme.ts, themeBootScript) -->
    <script>try{var c=localStorage.getItem("companyfeatures-theme");document.documentElement.dataset.theme=c==="light"||c==="dark"?c:matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"}catch(e){document.documentElement.dataset.theme="dark"}</script>
    <style>html{background:#fff}html[data-theme=dark]{background:#000}</style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
