name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Types, lint, tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  postgres:
    name: Tests on Postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:pg
        env:
          FF_TEST_PG: postgres://postgres:postgres@localhost:5432/postgres

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: companyflags:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start it and wait until it's ready
        run: |
          docker run -d --name cf -p 8787:8787 -e BETTER_AUTH_SECRET=ci-only-secret-0123456789abcdefghij \
            -e BETTER_AUTH_URL=http://localhost:8787 companyflags:ci
          for _ in $(seq 1 30); do curl -sf http://localhost:8787/readyz && exit 0; sleep 1; done
          docker logs cf
          exit 1
      - name: The console, the sign-in and the setup link answer
        run: |
          curl -sf -o /dev/null http://localhost:8787/
          curl -sf -o /dev/null http://localhost:8787/api/sign-in
          # a new server prints the link that makes the admin account; it opens the console
          link=$(docker logs cf 2>&1 | grep -o 'http[^ ]*/api/setup/[A-Za-z0-9_-]*' | head -1)
          test -n "$link"
          test "$(curl -s -o /dev/null -w '%{http_code}' "$link")" = 302
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8787/api/setup/wrong)" = 404

  docs:
    name: Docs site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm docs:build
