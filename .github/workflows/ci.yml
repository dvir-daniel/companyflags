# Types, lint, tests (embedded and real Postgres), the Docker image and the docs site. release.yml and npm.yml call it
# (workflow_call) on a vX.Y.Z tag, so nothing is released from a commit that fails it.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

# Called from release.yml and npm.yml on the same tag, github.workflow is the caller's: the two runs don't cancel
# each other, and a run on a tag is never cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  check:
    name: Types, lint, tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  postgres:
    name: Tests on Postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:pg
        env:
          FF_TEST_PG: postgres://postgres:postgres@localhost:5432/postgres

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: companyflags:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start it and wait until it's ready
        run: |
          docker run -d --name cf -p 8787:8787 -e BETTER_AUTH_SECRET=ci-only-secret-0123456789abcdefghij \
            -e BETTER_AUTH_URL=http://localhost:8787 companyflags:ci
          for _ in $(seq 1 30); do curl -sf http://localhost:8787/readyz && exit 0; sleep 1; done
          docker logs cf
          exit 1
      - name: The console, the sign-in and the setup link answer
        run: |
          curl -sf -o /dev/null http://localhost:8787/
          curl -sf -o /dev/null http://localhost:8787/api/sign-in
          # a new server prints the link that makes the admin account; it opens the console
          link=$(docker logs cf 2>&1 | grep -o 'http[^ ]*/api/setup/[A-Za-z0-9_-]*' | head -1)
          test -n "$link"
          test "$(curl -s -o /dev/null -w '%{http_code}' "$link")" = 302
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8787/api/setup/wrong)" = 404

  docs:
    name: Docs site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm docs:build
