name: Feature request
description: Suggest something CompanyFeatures should do.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you're trying to do, and what gets in the way today. Start from your situation, not the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd like
      description: How it could work in the console, the API or the SDK.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you do instead today
  - type: checkboxes
    id: help
    attributes:
      label: Contributing
      options:
        - label: I'd like to build this myself, with guidance.
