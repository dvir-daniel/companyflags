# The server and console live at the root; packages/ holds the console's UI library, docs/ the docs site, examples/
# the sample apps. One lockfile for all of them. packages/companyflags isn't a project of its own: it is the npm
# package that build.ts makes from the root's sources (same name, so it stays out).
packages:
  - packages/*
  - '!packages/companyflags'
  - docs
  - examples/*

# Install scripts that may run (pnpm runs none it isn’t told about): esbuild, which the npm package’s build uses, checks its binary.
allowBuilds:
  esbuild: true
